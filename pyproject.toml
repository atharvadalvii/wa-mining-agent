[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoagent"
version = "0.1.0"
description = "A CLI geospatial AI agent using OSMnx/GeoPandas tools with OpenAI tool calling"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "osmnx>=2.0",
    "geopandas",
    "networkx",
    "python-dotenv",
    "scikit-learn",
    "rich",
    "folium",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
api = [
    "fastapi",
    "uvicorn[standard]",
]
dashboard = [
    "streamlit",
    "streamlit-folium",
]
gradio = [
    "gradio",
]
local-wa = [
    "pyrosm",
]

[project.scripts]
geoagent = "geoagent.cli:main"
geoagent-setup-wa = "geoagent.setup_local_wa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: hits real OSM/Overpass network services, requires network access",
]
addopts = "-m 'not integration'"
