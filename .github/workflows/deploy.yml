name: Deploy to AWS

# Manual only: nothing deploys on push. Run it from the Actions tab after the AWS
# infrastructure exists (see "Deploying to AWS" in the README).
on:
  workflow_dispatch:

permissions:
  id-token: write # lets the job request short-lived AWS credentials via OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: wa-mining-agent
  ECS_CLUSTER: wa-mining-agent
  ECS_SERVICE: wa-mining-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:latest" -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" .
          docker push --all-tags "$REGISTRY/$ECR_REPOSITORY"

      - name: Roll the service onto the new image
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
