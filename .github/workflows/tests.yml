name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package with test + API extras
        run: pip install -e ".[dev,api]"

      # Deliberately excludes tests/integration (see its `integration` pytest
      # marker), which hits real OSM/Overpass services and would make CI flaky
      # and network-dependent. `pyproject.toml`'s addopts already filters it
      # out by default, so this is the same command a contributor runs locally.
      - name: Run unit tests
        run: pytest tests/unit -v
